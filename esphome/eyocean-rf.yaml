substitutions:
  name: eyocean-rf
  friendly_name: EYOCEAN Desk Lamp

  board: esp32-s3-devkitc-1
  pin_sck: GPIO9
  pin_mosi: GPIO10
  pin_miso: GPIO11
  pin_cs: GPIO12
  pin_tx: GPIO13
  pin_rx: GPIO14

  remote_id: "0xBAD1"
  xor_key: "0x4E"
  cmd_night_light: "0x41"
  cmd_timer: "0x4D"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

spi:
  clk_pin: ${pin_sck}
  mosi_pin: ${pin_mosi}
  miso_pin: ${pin_miso}

cc1101:
  cs_pin: ${pin_cs}
  frequency: 433.92MHz
  symbol_rate: 40000
  modulation_type: ASK/OOK

remote_transmitter:
  pin: ${pin_tx}
  carrier_duty_percent: 100%
  non_blocking: true
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

remote_receiver:
  pin: ${pin_rx}
  dump: all
  filter: 50us
  idle: 10ms

button:
  - platform: template
    name: "Power"
    id: btn_power
    icon: "mdi:desk-lamp"
    on_press:
      - script.execute:
          id: send_cmd
          cmd: 0x51

  - platform: template
    name: "Brightness"
    id: btn_brightness
    icon: "mdi:brightness-6"
    on_press:
      - script.execute:
          id: send_cmd
          cmd: 0x5B

  - platform: template
    name: "Color Temperature"
    id: btn_color_temp
    icon: "mdi:thermometer"
    on_press:
      - script.execute:
          id: send_cmd
          cmd: 0x5A

  - platform: template
    name: "Reading Mode"
    id: btn_reading_mode
    icon: "mdi:book-open-variant"
    on_press:
      - script.execute:
          id: send_cmd
          cmd: 0x49

  - platform: template
    name: "Night Light"
    id: btn_night_light
    icon: "mdi:weather-night"
    on_press:
      - script.execute:
          id: send_cmd
          cmd: ${cmd_night_light}

  - platform: template
    name: "Timer Function"
    id: btn_timer
    icon: "mdi:timer-outline"
    on_press:
      - script.execute:
          id: send_cmd
          cmd: ${cmd_timer}

  - platform: restart
    name: "Restart"

script:
  - id: send_cmd
    parameters:
      cmd: int
    then:
      - remote_transmitter.transmit_raw:
          code: !lambda |-
            const int32_t T = 250;
            const uint8_t c = cmd & 0xFF;
            const uint32_t ev_code = (uint32_t) ${remote_id} << 16 | c << 8 | (c ^ ${xor_key});
            std::vector<int32_t> raw;
            raw.push_back(T);
            raw.push_back(-25 * T);
            for (int i = 31; i >= 0; i--) {
              if ((ev_code >> i) & 1) {
                raw.push_back(3 * T);
                raw.push_back(-1 * T);
              } else {
                raw.push_back(1 * T);
                raw.push_back(-3 * T);
              }
            }
            return raw;
          repeat:
            times: 8
            wait_time: 0us
